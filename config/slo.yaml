service: day13-l3b-monitoring-llmops-lab
primary_slo:
  name: fast_successful_requests
  window: 28d
  sli:
    good_event: 'event == "response_sent" and latency_ms <= 3000'
    total_event: 'event == "request_received"'
  target_percent: 99.5
  error_budget_percent: 0.5
  baseline: CP1/CP2 workload thường đạt latency 150-155 ms; ngưỡng 3000 ms chừa headroom cho network và managed prompt nhưng vẫn phát hiện tail latency bất thường.
  error_budget_example:
    requests_in_window: 10000
    allowed_bad_requests: 50
    calculation: 10000 * (1 - 0.995) = 50
  note: Một request tốt phải có response_sent và latency_ms <= 3000. Với 10.000 request trong 28 ngày, tối đa 50 request được phép lỗi hoặc chậm hơn ngưỡng.
guardrails:
  error_rate_pct_max: 2
  daily_cost_usd_max: 2.5
  quality_score_avg_min: 0.75
  retrieval_success_rate_pct_min: 90
